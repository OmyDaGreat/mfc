name: Java CI with Gradle

on:
  push:
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '27'
        distribution: 'temurin'

    - name: Build with Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Check and build Java CLI
      run: ./gradlew :app:check :app:distZip

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            native: linux-x64
          - os: ubuntu-24.04-arm
            native: linux-arm64
          - os: macos-latest
            native: macos-arm64
          - os: windows-latest
            native: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7

    - name: Set up GraalVM 25
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '27'
        distribution: 'graalvm-community'
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build with Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build native CLI
      run: ./gradlew :app:nativeCompile

    # The image ships with the JDK libraries it loads at runtime (javax.sound
    # pulls in libjsound/libawt), so package the whole output directory.
    - name: Package native CLI
      working-directory: app/build/native/nativeCompile
      run: |
        mkdir -p "$GITHUB_WORKSPACE/dist"
        if [ -f mfc.exe ]; then
          7z a "$GITHUB_WORKSPACE/dist/mfc-${{ matrix.native }}.zip" ./*
        else
          tar -czf "$GITHUB_WORKSPACE/dist/mfc-${{ matrix.native }}.tar.gz" ./*
        fi

    - name: Upload native CLI
      uses: actions/upload-artifact@v7
      with:
        name: mfc-${{ matrix.native }}
        path: dist/*
        if-no-files-found: error
